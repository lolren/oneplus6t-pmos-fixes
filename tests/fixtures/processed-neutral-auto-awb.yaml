# Deterministic processed-path AWB frame for simple-pipeline sensors.
# The sensor test-pattern components are written through V4L2 before capture.
properties:
  - loop: 32

frames:
  - 0:
      TestPatternMode: 1
      AwbEnable: true
      Gamma: 1.0
      Contrast: 1.0
      Saturation: 1.0
      Sharpness: 1.0
