#
# The postmarketOS PipeWire package ships a PulseAudio compatibility fragment
# that disables WirePlumber's ALSA hardware monitor. That leaves pactl's
# compatibility card visible while wpctl/Phosh have no native sinks or
# sources. Re-enable the hardware monitor for this phone's user session.
wireplumber.profiles = {
  main = {
    hardware.audio = required
    hardware.bluetooth = required
  }
}
