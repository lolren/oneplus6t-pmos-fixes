#
# Waydroid's ALSA/Pulse bridge can request a 256-frame quantum.  The OnePlus
# 6T graph normally runs at 1024 frames, and accepting that smaller request
# has caused silent or stuck Android playback after a graph restart.  Keep
# the graph free to run at its normal quantum while preventing requests below
# the stable bridge floor.
context.properties = {
	default.clock.min-quantum = 512
}
