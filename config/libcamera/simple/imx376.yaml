# SPDX-License-Identifier: CC0-1.0
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          # OnePlus 6T IMX376 calibration recovered from the matching stock
          # sensor tuning; it is plain libcamera data, not a vendor binary.
          ccm: [ 1.7858, -0.7494, -0.0364,
                 -0.1317, 1.209, -0.0773,
                 0.04, -0.7876, 1.7476 ]
  - Af:
      minPosition: 400
      maxPosition: 800
      initialPosition: 600
      lensPositionMin: 0.0
      lensPositionMax: 2.0
      coarseStep: 100
      fineStep: 25
      fineRange: 50
      settleTimeMs: 200
      settleFrames: 2
      startupDelayMs: 2000
      measureTimeMs: 100
      measureSamples: 2
      fastMeasureTimeMs: 0
      fastMeasureSamples: 1
      focusTolerance: 0.10
      finalFocusTolerance: 0.25
      restartRatio: 0.7
      monitorReferenceDecay: 0.98
      monitorReferenceRise: 0.2
      monitorReferenceRiseWindows: 3
      monitorWindowMs: 250
      restartHoldMs: 1500
      restartDelayMs: 3000
      continuous: true
  - Adjust:
      gamma: 2.1
      contrast: 1.1
      saturation: 1.35
      sharpness: 1.0
  - Agc:
      target: 2.0
      highlightQuantile: 0.98
      highlightTarget: 0.95
...
