# SPDX-License-Identifier: CC0-1.0
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        # OnePlus 6T IMX519 calibration profile.  These matrices are the
        # colour transforms recovered from the phone's stock sensor tuning
        # and are kept as ordinary libcamera data, not a vendor binary.
        - ct: 2400
          ccm: [ 1.4905, -0.545645, 0.0551411,
                 -0.220963, 1.14068, 0.0802817,
                 -0.0620148, -0.598863, 1.66088 ]
        - ct: 3250
          ccm: [ 1.4905, -0.545645, 0.0551411,
                 -0.220963, 1.14068, 0.0802817,
                 -0.0620148, -0.598863, 1.66088 ]
        - ct: 4300
          ccm: [ 1.56339, -0.74001, 0.176618,
                 -0.140864, 1.12936, 0.011506,
                 0.0938884, -0.83175, 1.73786 ]
        - ct: 4600
          ccm: [ 1.56339, -0.74001, 0.176618,
                 -0.140864, 1.12936, 0.011506,
                 0.0938884, -0.83175, 1.73786 ]
        - ct: 5000
          ccm: [ 1.89305, -0.942903, 0.049853,
                 0.034627, 0.979567, -0.014195,
                 0.225675, -1.00057, 1.77489 ]
        - ct: 10000
          ccm: [ 1.89305, -0.942903, 0.049853,
                 0.034627, 0.979567, -0.014195,
                 0.225675, -1.00057, 1.77489 ]
  - Af:
      minPosition: 400
      maxPosition: 800
      initialPosition: 600
      lensPositionMin: 0.0
      lensPositionMax: 2.0
      coarseStep: 100
      fineStep: 25
      fineRange: 50
      settleTimeMs: 200
      settleFrames: 2
      startupDelayMs: 2000
      measureTimeMs: 100
      measureSamples: 2
      fastMeasureTimeMs: 0
      fastMeasureSamples: 1
      focusTolerance: 0.10
      finalFocusTolerance: 0.25
      restartRatio: 0.7
      monitorReferenceDecay: 0.98
      monitorReferenceRise: 0.2
      monitorReferenceRiseWindows: 3
      monitorWindowMs: 250
      restartHoldMs: 1500
      restartDelayMs: 3000
      continuous: true
  - Adjust:
      gamma: 2.2
      contrast: 1.1
      saturation: 1.35
      sharpness: 1.0
  - Agc:
      target: 2.0
      highlightQuantile: 0.98
      highlightTarget: 0.95
...
