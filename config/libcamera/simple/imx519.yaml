# SPDX-License-Identifier: CC0-1.0
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 6500
          ccm: [ 1, 0, 0,
                 0, 1, 0,
                 0, 0, 1 ]
  - Af:
      minPosition: 400
      maxPosition: 800
      initialPosition: 600
      coarseStep: 100
      fineStep: 25
      fineRange: 50
      settleTimeMs: 200
      settleFrames: 2
      startupDelayMs: 2000
      measureTimeMs: 100
      measureSamples: 2
      fastMeasureTimeMs: 0
      fastMeasureSamples: 1
      focusTolerance: 0.10
      finalFocusTolerance: 0.25
      restartRatio: 0.7
      monitorReferenceDecay: 0.98
      monitorWindowMs: 250
      restartHoldMs: 1500
      restartDelayMs: 3000
      continuous: true
  - Adjust:
      gamma: 2.2
      contrast: 1.05
      saturation: 1.25
      sharpness: 1.0
  - Agc:
      target: 2.0
      highlightQuantile: 0.98
      highlightTarget: 0.95
...
