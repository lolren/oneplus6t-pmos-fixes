# SPDX-License-Identifier: CC0-1.0
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        # Keep equal RGB neutral while gently suppressing the measured
        # green-channel excess in ordinary scenes.  Every row sums to one,
        # so the deterministic equal-channel calibration frame remains grey.
        - ct: 6500
          ccm: [ 0.97, 0.03, 0.0,
                 0.03, 0.94, 0.03,
                 0.0, 0.03, 0.97 ]
  - Af:
      minPosition: 400
      maxPosition: 800
      initialPosition: 600
      lensPositionMin: 0.0
      lensPositionMax: 2.0
      coarseStep: 100
      fineStep: 25
      fineRange: 50
      settleTimeMs: 200
      settleFrames: 2
      startupDelayMs: 2000
      measureTimeMs: 100
      measureSamples: 2
      fastMeasureTimeMs: 0
      fastMeasureSamples: 1
      focusTolerance: 0.10
      finalFocusTolerance: 0.25
      restartRatio: 0.7
      monitorReferenceDecay: 0.98
      monitorReferenceRise: 0.2
      monitorReferenceRiseWindows: 3
      monitorWindowMs: 250
      restartHoldMs: 1500
      restartDelayMs: 3000
      continuous: true
  - Adjust:
      gamma: 2.2
      contrast: 1.1
      saturation: 1.35
      sharpness: 1.0
  - Agc:
      target: 2.0
      highlightQuantile: 0.98
      highlightTarget: 0.95
...
